<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar Toolbox</title>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <link rel="stylesheet" href="style.css">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0JQD4RVE06"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date()); gtag('config', 'G-0JQD4RVE06');
    </script>
</head>
<body>

<div class="container">
    <div class="header-top">
        <div class="logo-text">Solar Toolbox</div>
        <div class="lang-switch">
            <button class="lang-btn" onclick="setLang('ru')" data-l="ru">RU</button>
            <button class="lang-btn" onclick="setLang('ua')" data-l="ua">UA</button>
            <button class="lang-btn" onclick="setLang('pl')" data-l="pl">PL</button>
            <button class="lang-btn" onclick="setLang('en')" data-l="en">EN</button>
        </div>
    </div>

    <div class="welcome">
        <h1 data-t="w_h">Инструменты</h1>
        <p data-t="w_p">Помощник инженера солнечных систем</p>
    </div>
    
    <div class="main-grid">
        <a href="string.html" class="tool-card">
            <div class="tool-icon">📏</div>
            <div class="tool-info">
                <span class="tool-title" data-t="m1_t">Макс. длина стринга</span>
                <span class="tool-desc" data-t="m1_d">Расчет Voc и напряжения по температуре</span>
            </div>
        </a>

        <a href="string-range.html" class="tool-card">
            <div class="tool-icon">📊</div>
            <div class="tool-info">
                <span class="tool-title" data-t="m3_t">Калькулятор диапазона</span>
                <span class="tool-desc" data-t="m3_d">Оптимальное кол-во модулей (Min/Max)</span>
            </div>
        </a>

        <a href="pinouts.html" class="tool-card">
            <div class="tool-icon">🔌</div>
            <div class="tool-info">
                <span class="tool-title" data-t="m2_t">Распиновки BMS</span>
                <span class="tool-desc" data-t="m2_d">Схемы CAN / RS485 / RJ45</span>
            </div>
        </a>
    </div>
</div>
    
<div class="back-btn-container">
    <a href="index.html" id="backBtn" class="lang-btn">← Назад</a>
</div>
<script src="app.js"></script>
</body>
</html>
