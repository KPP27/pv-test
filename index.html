<!DOCTYPE html>
<html lang="ru">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0JQD4RVE06"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0JQD4RVE06');
    </script>
      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV String Calculator</title>

    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #222;
            --accent: #2a8cff;
            --border: #ddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 14px;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* Навигация */
        .menu {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .menu-btn {
            flex: 1;
            padding: 10px 5px;
            font-size: 13px;
            background: #f0f0f0;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .menu-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h2 { margin: 0; font-size: 1.2rem; }

        .lang-switch { display: flex; gap: 6px; }

        .lang-btn {
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: white;
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        label { font-size: 14px; margin-top: 14px; display: block; color: #555; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 16px;
            box-sizing: border-box; 
            transition: 0.2s;
        }

        input:focus { outline: none; border-color: var(--accent); }

        .calc-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            background: #fafafa;
        }

        .result.show { opacity: 1; transform: translateY(0); }

        .copy-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            font-weight: 500;
        }
        
        .copy-btn.copied { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <nav class="menu">
        <button class="menu-btn active" onclick="location.href='index.html'">
            🔌 Макс. стринг
        </button>
        <button class="menu-btn" onclick="location.href='string-range.html'">
            📐 Мин/Макс модули
        </button>
    </nav>

    <div class="top-bar">
        <h2 id="title">📟 Калькулятор</h2>
        <div class="lang-switch">
            <div class="lang-btn" data-lang="ru">RU</div>
            <div class="lang-btn" data-lang="ua">UA</div>
            <div class="lang-btn" data-lang="en">EN</div>
            <div class="lang-btn" data-lang="pl">PL</div>
        </div>
    </div>

    <label id="l1"></label>
    <input type="number" id="E13" inputmode="decimal">

    <label id="l2"></label>
    <input type="number" id="E14" inputmode="decimal">

    <label id="l3"></label>
    <input type="number" id="E15" inputmode="decimal">

    <label id="l4"></label>
    <input type="number" id="E16" inputmode="decimal">

    <button onclick="calculate()" id="calcBtn" class="calc-btn"></button>

    <div class="result" id="result"></div>
    <button id="copyBtn" class="copy-btn">📋 Скопировать результат</button>
</div>

<script src="js/app.js"></script>

</body>
</html>
