<!DOCTYPE html>
<html lang="ru">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0JQD4RVE06"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0JQD4RVE06');
    </script>
      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV String Calculator</title>

    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #222;
            --accent: #2a8cff;
            --border: #ddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 14px;
        }

        body {
            font-family: system-ui, -apple-system, Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* Навигация */
        .menu {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .menu-btn {
            flex: 1;
            padding: 10px 5px;
            font-size: 13px;
            background: #f0f0f0;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h2 { margin: 0; font-size: 1.2rem; }

        .lang-switch { display: flex; gap: 6px; }

        .lang-btn {
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: white;
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        label { font-size: 14px; margin-top: 14px; display: block; color: #555; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 16px;
            box-sizing: border-box; 
            transition: 0.2s;
        }

        input:focus { outline: none; border-color: var(--accent); border-width: 1px; }

        .calc-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            background: #fafafa;
            word-wrap: break-word;
        }

        .result.show { opacity: 1; transform: translateY(0); }

        .copy-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            font-weight: 500;
        }
        
        .copy-btn.copied { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <nav class="menu">
        <button class="menu-btn active" onclick="location.href='index.html'">🔌 Макс. стринг</button>
        <button class="menu-btn" onclick="location.href='string-range.html'">📐 Мин/Макс модули</button>
    </nav>

    <div class="top-bar">
        <h2 id="title">📟 Калькулятор</h2>
        <div class="lang-switch">
            <div class="lang-btn" data-lang="ru">RU</div>
            <div class="lang-btn" data-lang="ua">UA</div>
            <div class="lang-btn" data-lang="en">EN</div>
            <div class="lang-btn" data-lang="pl">PL</div>
        </div>
    </div>

    <label id="l1"></label>
    <input type="number" id="E13" inputmode="decimal" placeholder="...">

    <label id="l2"></label>
    <input type="number" id="E14" inputmode="decimal" placeholder="...">

    <label id="l3"></label>
    <input type="number" id="E15" inputmode="decimal" placeholder="...">

    <label id="l4"></label>
    <input type="number" id="E16" inputmode="decimal" placeholder="...">

    <button onclick="calculate()" id="calcBtn" class="calc-btn"></button>

    <div class="result" id="result"></div>
    <button id="copyBtn" class="copy-btn">📋 Скопировать результат</button>
</div>

<script>
const T = {
    ru: {
        title: "📟 Калькулятор фотомодулей",
        l1: "Максимально допустимое напряжение DC",
        l2: "Напряжение холостого хода модуля (Voc)",
        l3: "Мин. температура на объекте (°C)",
        l4: "Темп. коэффициент Voc (%)",
        ph1: "Например: 1100", ph2: "Например: 41.5", ph3: "Например: -25", ph4: "Например: -0.29",
        calc: "Рассчитать", empty: "⚠️ Заполните все поля",
        result: "🔋 Максимальное количество: ", copyBtn: "📋 Скопировать",
        copied: "✅ Скопировано!", calculatedVoc: "📊 Расчетный Voc", explanation: "при мин. темп."
    },
    ua: {
        title: "📟 Калькулятор фотомодулів",
        l1: "Максимальна напруга DC інвертора",
        l2: "Voc модуля (STC)",
        l3: "Мінімальна температура (°C)",
        l4: "Температурний коефіцієнт Voc (%)",
        ph1: "Наприклад: 1100", ph2: "Наприклад: 41.5", ph3: "Наприклад: -25", ph4: "Наприклад: -0.29",
        calc: "Розрахувати", empty: "⚠️ Заповніть всі поля",
        result: "🔋 Максимальна кількість: ", copyBtn: "📋 Копіювати",
        copied: "✅ Скопійовано!", calculatedVoc: "📊 Розрахунковий Voc", explanation: "при мін. темп."
    },
    en: {
        title: "📟 PV Module Calculator",
        l1: "Max DC input voltage",
        l2: "Module Voc (STC)",
        l3: "Min. temperature (°C)",
        l4: "Temperature coefficient Voc (%)",
        ph1: "Example: 1100", ph2: "Example: 41.5", ph3: "Example: -25", ph4: "Example: -0.29",
        calc: "Calculate", empty: "⚠️ Fill all fields",
        result: "🔋 Maximum modules: ", copyBtn: "📋 Copy result",
        copied: "✅ Copied!", calculatedVoc: "📊 Calculated Voc", explanation: "at min temp"
    },
    pl: {
        title: "📟 Kalkulator modułów PV",
        l1: "Max napięcie DC falownika",
        l2: "Voc modułu (STC)",
        l3: "Minimalna temperatura (°C)",
        l4: "Współczynnik Voc (%)",
        ph1: "Przykład: 1100", ph2: "Przykład: 41.5", ph3: "Przykład: -25", ph4: "Przykład: -0.29",
        calc: "Oblicz", empty: "⚠️ Uzupełnij pola",
        result: "🔋 Maksymalna liczba: ", copyBtn: "📋 Skopiuj",
        copied: "✅ Skopiowano!", calculatedVoc: "📊 Obliczony Voc", explanation: "w min. temp."
    }
};

function applyLang(lang) {
    localStorage.setItem("lang", lang);
    const t = T[lang];
    document.getElementById('title').textContent = t.title;
    document.getElementById('l1').textContent = t.l1;
    document.getElementById('l2').textContent = t.l2;
    document.getElementById('l3').textContent = t.l3;
    document.getElementById('l4').textContent = t.l4;
    document.getElementById('E13').placeholder = t.ph1;
    document.getElementById('E14').placeholder = t.ph2;
    document.getElementById('E15').placeholder = t.ph3;
    document.getElementById('E16').placeholder = t.ph4;
    document.getElementById('calcBtn').textContent = t.calc;
    document.getElementById('copyBtn').textContent = t.copyBtn;

    document.querySelectorAll(".lang-btn").forEach(btn =>
        btn.classList.toggle("active", btn.dataset.lang === lang)
    );
}

document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.onclick = () => applyLang(btn.dataset.lang);
});

// Инициализация языка
const savedLang = localStorage.getItem("lang") || "ru";
applyLang(savedLang);

let lastCalculationData = {};

function calculate() {
    const lang = localStorage.getItem("lang") || "ru";
    const t = T[lang];
    const e13 = +document.getElementById('E13').value;
    const e14 = +document.getElementById('E14').value;
    const e15 = +document.getElementById('E15').value;
    const e16 = +document.getElementById('E16').value;
    const resDiv = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');

    if (!e13 || !e14 || !e16) { // e15 может быть 0
        resDiv.textContent = t.empty;
        resDiv.classList.add("show");
        return;
    }

    const vocCorr = e14 * (1 + (e15 - 25) * (e16 / 100));
    const count = Math.floor(e13 / vocCorr);

    lastCalculationData = {
        resText: t.result + count,
        details: `${t.calculatedVoc}: ${vocCorr.toFixed(2)} V (${t.explanation})`,
        raw: { e13, e14, e15, e16 }
    };

    resDiv.innerHTML = `${lastCalculationData.resText}<br><small style="font-weight:normal; opacity:0.7">${lastCalculationData.details}</small>`;
    resDiv.classList.remove("show");
    setTimeout(() => resDiv.classList.add("show"), 20);
    copyBtn.style.display = "block";
}

document.getElementById('copyBtn').onclick = function() {
    const t = T[localStorage.getItem("lang") || "ru"];
    const text = `${document.getElementById('title').textContent}\n\n${lastCalculationData.resText}\n${lastCalculationData.details}`;
    
    navigator.clipboard.writeText(text).then(() => {
        this.textContent = t.copied;
        this.classList.add("copied");
        setTimeout(() => {
            this.textContent = t.copyBtn;
            this.classList.remove("copied");
        }, 2000);
    });
};
</script>
</body>
</html>
