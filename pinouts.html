<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMS Pinouts</title>
    <style>
        :root { --accent: #2a8cff; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { max-width: 480px; width: 100%; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .back-btn { display: block; text-align: left; margin-bottom: 15px; color: var(--accent); text-decoration: none; font-weight: bold; }
        
        .pinout-wrapper { position: relative; border: 1px solid #ddd; border-radius: 12px; overflow: hidden; background: #fff; }
        svg { width: 100%; height: auto; display: block; }

        /* Слой для iPhone */
        #iosLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; z-index: 10; display: none;
            -webkit-touch-callout: default !important;
        }

        /* Кнопка для ПК */
        .pc-controls { display: none; margin-top: 15px; justify-content: center; }
        .icon-btn { 
            background: #f0f0f0; border: 1px solid #ccc; border-radius: 8px; 
            padding: 10px 20px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .icon-btn:hover { background: #e0e0e0; }
        .icon-btn svg { width: 20px; height: 20px; }

        .status-msg { font-size: 13px; color: #666; margin-top: 12px; line-height: 1.4; min-height: 1.4em; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 20px; display: none; z-index: 100; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Назад</a>
    
    <div class="pinout-wrapper">
        <img id="iosLayer" src="" alt="Pinout">
        <svg id="bmsSvg" viewBox="0 0 800 380">
            <rect width="800" height="380" fill="white" />
            <text x="400" y="210" font-family="Arial" font-size="44" font-weight="bold" fill="#f4f4f4" text-anchor="middle">pvstringbot</text>
            
            <g id="master" transform="translate(80, 80)">
                <rect x="0" y="30" width="144" height="200" rx="8" fill="#fcfcfc" stroke="#999" />
                <rect x="12" y="0" width="120" height="30" fill="#f0f0f0" stroke="#999" />
                <rect x="17" y="30" width="10" height="100" fill="#fff" stroke="#FF8C00" stroke-width="2"/>
                <rect x="31" y="30" width="10" height="100" fill="#FF8C00"/>
                <rect x="45" y="30" width="10" height="100" fill="#fff" stroke="#32CD32" stroke-width="2"/>
                <rect x="59" y="30" width="10" height="100" fill="#0000FF"/>
                <rect x="73" y="30" width="10" height="100" fill="#fff" stroke="#0000FF" stroke-width="2"/>
                <rect x="87" y="30" width="10" height="100" fill="#32CD32"/>
                <rect x="101" y="30" width="10" height="100" fill="#fff" stroke="#8B4513" stroke-width="2"/>
                <rect x="115" y="30" width="10" height="100" fill="#8B4513"/>
                <path d="M 0 170 Q 0 230 144 230 Q 144 170 144 170 Z" fill="#2a8cff" />
                <text x="72" y="210" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial">MASTER</text>
                <g font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">
                    <text x="22" y="22">1</text><text x="36" y="22">2</text><text x="50" y="22">3</text><text x="64" y="22">4</text>
                    <text x="78" y="22">5</text><text x="92" y="22">6</text><text x="106" y="22">7</text><text x="120" y="22">8</text>
                </g>
            </g>

            <g id="slave" transform="translate(580, 80)">
                <rect x="0" y="30" width="144" height="200" rx="8" fill="#fcfcfc" stroke="#999" />
                <rect x="12" y="0" width="120" height="30" fill="#f0f0f0" stroke="#999" />
                <rect x="17" y="30" width="10" height="100" fill="#fff" stroke="#FF8C00" stroke-width="2"/>
                <rect x="31" y="30" width="10" height="100" fill="#FF8C00"/>
                <rect x="45" y="30" width="10" height="100" fill="#fff" stroke="#32CD32" stroke-width="2"/>
                <rect x="59" y="30" width="10" height="100" fill="#0000FF"/>
                <rect x="73" y="30" width="10" height="100" fill="#fff" stroke="#0000FF" stroke-width="2"/>
                <rect x="87" y="30" width="10" height="100" fill="#32CD32"/>
                <rect x="101" y="30" width="10" height="100" fill="#fff" stroke="#8B4513" stroke-width="2"/>
                <rect x="115" y="30" width="10" height="100" fill="#8B4513"/>
                <path d="M 0 170 Q 0 230 144 230 Q 144 170 144 170 Z" fill="#2a8cff" />
                <text x="72" y="210" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial">SLAVE</text>
                <g font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">
                    <text x="22" y="22">1</text><text x="36" y="22">2</text><text x="50" y="22">3</text><text x="64" y="22">4</text>
                    <text x="78" y="22">5</text><text x="92" y="22">6</text><text x="106" y="22">7</text><text x="120" y="22">8</text>
                </g>
            </g>
            <path d="M 224 300 C 350 300, 350 360, 400 360 C 450 360, 450 300, 580 300" stroke="#2a8cff" stroke-width="16" fill="none" stroke-linecap="round"/>
        </svg>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div id="pcControls" class="pc-controls">
        <button class="icon-btn" onclick="copyToClipboard()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
            Скопировать
        </button>
    </div>

</div>

<div id="toast" class="toast">✅ Скопировано!</div>

<script>
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    window.onload = function() {
        const svg = document.getElementById('bmsSvg');
        const status = document.getElementById('statusMsg');
        const pcControls = document.getElementById('pcControls');
        const iosLayer = document.getElementById('iosLayer');

        // Подготовка PNG для iPhone и ПК
        const svgData = new XMLSerializer().serializeToString(svg);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
            canvas.width = 800; canvas.height = 380;
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 800, 380);
            ctx.drawImage(img, 0, 0);
            const pngUrl = canvas.toDataURL('image/png');
            
            if (isIOS) {
                status.innerHTML = "Зажмите схему пальцем для копирования";
                iosLayer.style.display = 'block';
                iosLayer.src = pngUrl;
            } else if (!isMobile) {
                pcControls.style.display = 'flex';
                window.pcBlob = canvas.toBlob(b => window.currentBlob = b, 'image/png');
            } else {
                status.innerHTML = "Просмотр схемы распиновки T568B";
            }
            URL.revokeObjectURL(url);
        };
        img.src = url;
    };

    async function copyToClipboard() {
        if (!window.currentBlob) return;
        try {
            const item = new ClipboardItem({ "image/png": window.currentBlob });
            await navigator.clipboard.write([item]);
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        } catch (e) { alert("Ошибка копирования"); }
    }
</script>

</body>
</html>
