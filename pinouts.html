<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS Pinouts - PV Helper</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #222;
            --accent: #2a8cff;
            --border: #ddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 14px;
        }

        body {
            font-family: system-ui, -apple-system, Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        h2 { margin: 0 0 20px 0; font-size: 1.2rem; text-align: center; }

        .pinout-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            background: #fff;
            text-align: center;
        }

        /* Контейнер для SVG, чтобы он был адаптивным */
        .svg-container {
            width: 100%;
            background: #fff;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .copy-btn {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:active { transform: scale(0.98); opacity: 0.9; }

        .hint {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Назад к калькулятору</a>
    <h2>Распиновка Inverter ↔ BMS</h2>

    <div class="pinout-card">
        <div class="svg-container" id="svgWrapper">
            <svg id="bmsSvg" viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
                <rect width="800" height="350" fill="white" />
                
                <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">
                    BMS CAN Communication Cable
                </text>

                <g transform="translate(80, 80)">
                    <rect x="0" y="30" width="130" height="180" rx="8" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
                    <rect x="15" y="0" width="100" height="30" fill="#ddd" stroke="#333" stroke-width="2"/>
                    <text x="65" y="25" font-family="Arial" font-size="14" text-anchor="middle" letter-spacing="8">12345678</text>
                    <rect x="23" y="30" width="8" height="90" fill="#FFA500"/> <rect x="35" y="30" width="8" height="90" fill="#FF8C00"/> <rect x="47" y="30" width="8" height="90" fill="#90EE90"/> <rect x="59" y="30" width="8" height="90" fill="#0000FF"/> <rect x="71" y="30" width="8" height="90" fill="#ADD8E6"/> <rect x="83" y="30" width="8" height="90" fill="#008000"/> <rect x="95" y="30" width="8" height="90" fill="#8B4513"/> <rect x="107" y="30" width="8" height="90" fill="#5D2906"/> <path d="M 0 160 Q 0 210 130 210 Q 130 160 130 160 Z" fill="#2a8cff" />
                    <text x="65" y="190" fill="white" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">INVERTER</text>
                </g>

                <path d="M 210 270 C 350 270, 350 330, 400 330 C 450 330, 450 270, 590 270" stroke="#2a8cff" stroke-width="14" fill="none" stroke-linecap="round"/>
                <path d="M 380 328 L 420 328" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none" stroke-linecap="round"/>

                <g transform="translate(590, 80)">
                    <rect x="0" y="30" width="130" height="180" rx="8" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
                    <rect x="15" y="0" width="100" height="30" fill="#ddd" stroke="#333" stroke-width="2"/>
                    <text x="65" y="25" font-family="Arial" font-size="14" text-anchor="middle" letter-spacing="8">12345678</text>
                    <rect x="23" y="30" width="8" height="90" fill="#FFA500"/>
                    <rect x="35" y="30" width="8" height="90" fill="#FF8C00"/>
                    <rect x="47" y="30" width="8" height="90" fill="#90EE90"/>
                    <rect x="59" y="30" width="8" height="90" fill="#0000FF"/>
                    <rect x="71" y="30" width="8" height="90" fill="#ADD8E6"/>
                    <rect x="83" y="30" width="8" height="90" fill="#008000"/>
                    <rect x="95" y="30" width="8" height="90" fill="#8B4513"/>
                    <rect x="107" y="30" width="8" height="90" fill="#5D2906"/>
                    <path d="M 0 160 Q 0 210 130 210 Q 130 160 130 160 Z" fill="#2a8cff" />
                    <text x="65" y="190" fill="white" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">BATTERY</text>
                </g>

                <text x="400" y="290" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">Generated by PV Helper</text>
            </svg>
        </div>

        <button class="copy-btn" onclick="copyAsImage()">📋 Скопировать схему</button>
        <p class="hint">Нажмите кнопку, чтобы скопировать изображение в буфер обмена, затем вставьте его (Ctrl+V) в мессенджер.</p>
    </div>
</div>

<div id="toast" class="toast">✅ Картинка скопирована!</div>

<script>
    async function copyAsImage() {
        const svg = document.getElementById('bmsSvg');
        const toast = document.getElementById('toast');
        
        try {
            // 1. Превращаем SVG в XML строку
            const svgData = new XMLSerializer().serializeToString(svg);
            
            // 2. Создаем виртуальное изображение
            const img = new Image();
            const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
            const url = URL.createObjectURL(svgBlob);

            img.onload = function() {
                // 3. Рисуем на Canvas
                const canvas = document.createElement("canvas");
                canvas.width = 800; // фиксированная ширина для качества
                canvas.height = 350;
                const ctx = canvas.getContext("2d");
                
                // Белый фон (обязательно для мессенджеров)
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.drawImage(img, 0, 0);

                // 4. Копируем как PNG Blob
                canvas.toBlob(async (blob) => {
                    const data = [new ClipboardItem({ [blob.type]: blob })];
                    await navigator.clipboard.write(data);
                    
                    // Показываем уведомление
                    toast.style.display = 'block';
                    setTimeout(() => toast.style.display = 'none', 2000);
                    
                    URL.revokeObjectURL(url);
                }, 'image/png');
            };
            
            img.src = url;

        } catch (err) {
            console.error(err);
            alert("Ошибка копирования. Используйте HTTPS или другой браузер.");
        }
    }
</script>

</body>
</html>
