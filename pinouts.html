<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS Pinouts - PV Helper</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #222;
            --accent: #2a8cff;
            --border: #ddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 14px;
        }

        body {
            font-family: system-ui, -apple-system, Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h2 { margin: 0 0 20px 0; font-size: 1.2rem; text-align: center; color: var(--text); }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .pinout-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            transition: 0.2s;
        }

        .pinout-card:active { transform: scale(0.98); }

        .pinout-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            color: #333;
        }

        .pinout-img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #eee;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Назад к калькулятору</a>
    <h2 id="mainTitle">Схемы распиновки BMS</h2>

    <div class="pinout-card" onclick="copyScheme('canvasDeye')">
        <div class="pinout-title">Deye / Sunsynk ↔ Pylontech (CAN)</div>
        <canvas id="canvasDeye" width="600" height="400" class="pinout-img"></canvas>
        <div class="hint">Нажми на схему, чтобы скопировать её</div>
    </div>

    <div class="pinout-card" onclick="copyScheme('canvasVictron')">
        <div class="pinout-title">Victron (BMS-Can) ↔ Pylontech</div>
        <canvas id="canvasVictron" width="600" height="400" class="pinout-img"></canvas>
        <div class="hint">Нажми на схему, чтобы скопировать её</div>
    </div>
</div>

<div id="toast" class="toast">✅ Схема скопирована!</div>

<script>
    // Функция для отрисовки схем на Canvas (чтобы их можно было копировать как PNG)
    function drawSchemes() {
        const drawRJ45 = (id, labelLeft, labelRight, pairs) => {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#333";
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "center";
            ctx.fillText(labelLeft + " ↔ " + labelRight, 300, 40);

            // Отрисовка распиновки (текстовая часть)
            ctx.font = "20px Arial";
            ctx.textAlign = "left";
            pairs.forEach((pair, i) => {
                ctx.fillStyle = pair.color;
                ctx.fillText(`Pin ${pair.pin}: ${pair.name}`, 150, 100 + (i * 40));
            });

            ctx.fillStyle = "#888";
            ctx.font = "16px Arial";
            ctx.fillText("PV Helper Tool", 450, 380);
        };

        // Данные для Deye
        drawRJ45('canvasDeye', 'Inverter (Deye)', 'Battery', [
            {pin: 4, name: 'CAN-H', color: '#d32f2f'},
            {pin: 5, name: 'CAN-L', color: '#1976d2'},
            {pin: 2, name: 'GND (Optional)', color: '#4caf50'}
        ]);

        // Данные для Victron
        drawRJ45('canvasVictron', 'Victron VE.Can', 'Pylontech', [
            {pin: 7, name: 'CAN-H', color: '#d32f2f'},
            {pin: 8, name: 'CAN-L', color: '#1976d2'},
            {pin: 3, name: 'GND', color: '#4caf50'}
        ]);
    }

    // Универсальная функция копирования Canvas как изображения
    async function copyScheme(canvasId) {
        const canvas = document.getElementById(canvasId);
        canvas.toBlob(async (blob) => {
            try {
                const item = new ClipboardItem({ "image/png": blob });
                await navigator.clipboard.write([item]);
                showToast();
            } catch (err) {
                alert("Ошибка копирования. Используйте современный браузер или HTTPS.");
            }
        });
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    window.onload = drawSchemes;
</script>

</body>
</html>
