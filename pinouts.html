<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMS Pinouts</title>
    <style>
        :root { --accent: #2a8cff; }
        body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .back-btn { display: block; text-align: left; margin-bottom: 15px; color: var(--accent); text-decoration: none; font-weight: bold; }
        .pinout-card { border: 1px solid #ddd; border-radius: 12px; padding: 10px; margin-bottom: 20px; }
        svg { width: 100%; height: auto; display: block; background: #fff; }
        .copy-btn { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; display: none; z-index: 100; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Назад</a>
    <div class="pinout-card">
        <svg id="bmsSvg" viewBox="0 0 800 380">
            <rect width="800" height="380" fill="white" />
            <text x="400" y="210" font-family="Arial" font-size="40" font-weight="bold" fill="#f8f8f8" text-anchor="middle">pvstringbot</text>
            
            <g transform="translate(80, 80)">
                <rect x="0" y="30" width="144" height="200" rx="8" fill="#f0f0f0" stroke="#999" />
                <rect x="12" y="0" width="120" height="30" fill="#ddd" stroke="#999" />
                <rect x="17" y="30" width="10" height="100" fill="#ffffff" stroke="#FF8C00" stroke-width="2"/> <rect x="31" y="30" width="10" height="100" fill="#FF8C00"/> <rect x="45" y="30" width="10" height="100" fill="#ffffff" stroke="#32CD32" stroke-width="2"/> <rect x="59" y="30" width="10" height="100" fill="#0000FF"/> <rect x="73" y="30" width="10" height="100" fill="#ffffff" stroke="#0000FF" stroke-width="2"/> <rect x="87" y="30" width="10" height="100" fill="#32CD32"/> <rect x="101" y="30" width="10" height="100" fill="#ffffff" stroke="#8B4513" stroke-width="2"/> <rect x="115" y="30" width="10" height="100" fill="#8B4513"/> <path d="M 0 170 Q 0 230 144 230 Q 144 170 144 170 Z" fill="#2a8cff" />
                <text x="72" y="210" fill="white" font-size="14" font-weight="bold" text-anchor="middle">MASTER</text>
                <g font-size="12" font-weight="bold" text-anchor="middle">
                    <text x="22" y="22">1</text><text x="36" y="22">2</text><text x="50" y="22">3</text><text x="64" y="22">4</text>
                    <text x="78" y="22">5</text><text x="92" y="22">6</text><text x="106" y="22">7</text><text x="120" y="22">8</text>
                </g>
            </g>

            <g transform="translate(580, 80)">
                <rect x="0" y="30" width="144" height="200" rx="8" fill="#f0f0f0" stroke="#999" />
                <rect x="12" y="0" width="120" height="30" fill="#ddd" stroke="#999" />
                <rect x="17" y="30" width="10" height="100" fill="#ffffff" stroke="#FF8C00" stroke-width="2"/> 
                <rect x="31" y="30" width="10" height="100" fill="#FF8C00"/>
                <rect x="45" y="30" width="10" height="100" fill="#ffffff" stroke="#32CD32" stroke-width="2"/>
                <rect x="59" y="30" width="10" height="100" fill="#0000FF"/>
                <rect x="73" y="30" width="10" height="100" fill="#ffffff" stroke="#0000FF" stroke-width="2"/>
                <rect x="87" y="30" width="10" height="100" fill="#32CD32"/>
                <rect x="101" y="30" width="10" height="100" fill="#ffffff" stroke="#8B4513" stroke-width="2"/>
                <rect x="115" y="30" width="10" height="100" fill="#8B4513"/>
                <path d="M 0 170 Q 0 230 144 230 Q 144 170 144 170 Z" fill="#2a8cff" />
                <text x="72" y="210" fill="white" font-size="14" font-weight="bold" text-anchor="middle">SLAVE</text>
                <g font-size="12" font-weight="bold" text-anchor="middle">
                    <text x="22" y="22">1</text><text x="36" y="22">2</text><text x="50" y="22">3</text><text x="64" y="22">4</text>
                    <text x="78" y="22">5</text><text x="92" y="22">6</text><text x="106" y="22">7</text><text x="120" y="22">8</text>
                </g>
            </g>

            <path d="M 224 300 C 350 300, 350 360, 400 360 C 450 360, 450 300, 580 300" stroke="#2a8cff" stroke-width="16" fill="none" stroke-linecap="round"/>
        </svg>
    </div>
    <button class="copy-btn" onclick="copyAction()">📋 Скопировать схему</button>
</div>

<div id="toast" class="toast">✅ Готово!</div>

<script>
function copyAction() {
    const svg = document.getElementById('bmsSvg');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    
    // Подготовка данных
    const svgData = new XMLSerializer().serializeToString(svg);
    const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);

    img.onload = function() {
        canvas.width = 800;
        canvas.height = 380;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 800, 380);
        ctx.drawImage(img, 0, 0);

        canvas.toBlob(async (blob) => {
            try {
                // Попытка копирования
                if (navigator.clipboard && window.ClipboardItem) {
                    const data = [new ClipboardItem({ 'image/png': blob })];
                    await navigator.clipboard.write(data);
                    showToast();
                } else {
                    throw new Error();
                }
            } catch (e) {
                // Запасной вариант для Telegram iOS: Сохранение файла
                const link = document.createElement('a');
                link.download = 'pinout.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                alert("Копирование заблокировано Telegram. Файл сохранен в память устройства.");
            }
            URL.revokeObjectURL(url);
        }, 'image/png');
    };
    img.src = url;
}

function showToast() {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}
</script>

</body>
</html>
