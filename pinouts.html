<style>
    canvas, svg {
        -webkit-touch-callout: default !important;
        user-select: all !important;
    }
</style>

<script>
    async function copyAsImage() {
        const svg = document.getElementById('bmsSvg');
        const toast = document.getElementById('toast');
        
        try {
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            
            // Увеличиваем масштаб для четкости (Retina дисплеи)
            const scale = 2; 
            canvas.width = 800 * scale;
            canvas.height = 380 * scale;
            ctx.scale(scale, scale);

            const img = new Image();
            const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
            const url = URL.createObjectURL(svgBlob);

            img.onload = async function() {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, 800, 380);
                ctx.drawImage(img, 0, 0, 800, 380);

                canvas.toBlob(async (blob) => {
                    try {
                        // Попытка №1: Современный Clipboard API
                        const item = new ClipboardItem({ "image/png": blob });
                        await navigator.clipboard.write([item]);
                        showToast("✅ Скопировано!");
                    } catch (err) {
                        // Попытка №2: Если Telegram блокирует API, предлагаем скачать
                        console.error("Clipboard blocked:", err);
                        
                        // Создаем временную ссылку для скачивания (это работает в TG)
                        const link = document.createElement('a');
                        link.download = 'bms-pinout.png';
                        link.href = canvas.toDataURL("image/png");
                        link.click();
                        
                        alert("TG блокирует буфер. Картинка сохранена в 'Файлы' или 'Загрузки'.\n\nТакже можно просто зажать схему пальцем и выбрать 'Скопировать'");
                    }
                    URL.revokeObjectURL(url);
                }, 'image/png');
            };
            img.src = url;
        } catch (e) {
            alert("Ошибка: " + e.message);
        }
    }

    function showToast(text) {
        const toast = document.getElementById('toast');
        toast.innerText = text;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2500);
    }
</script>
