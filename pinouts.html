<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS Pinouts - PV Helper</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #222;
            --accent: #2a8cff;
            --border: #ddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 14px;
        }

        body {
            font-family: system-ui, -apple-system, Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        h2 { margin: 0 0 20px 0; font-size: 1.2rem; text-align: center; }

        .pinout-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            background: #fff;
            text-align: center;
        }

        .svg-container {
            width: 100%;
            background: #fff;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        svg { width: 100%; height: auto; display: block; }

        .copy-btn {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:active { transform: scale(0.98); opacity: 0.9; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Назад</a>
    <h2>Распиновка кабеля BMS (T568B)</h2>

    <div class="pinout-card">
        <div class="svg-container">
            <svg id="bmsSvg" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="stripe-orange" x="0" y="0" width="1" height="20" patternUnits="userSpaceOnUse">
                        <rect width="10" height="20" fill="white"/>
                        <rect width="10" height="10" fill="#FF8C00"/>
                    </pattern>
                    <pattern id="stripe-green" x="0" y="0" width="1" height="20" patternUnits="userSpaceOnUse">
                        <rect width="10" height="20" fill="white"/>
                        <rect width="10" height="10" fill="#32CD32"/>
                    </pattern>
                    <pattern id="stripe-blue" x="0" y="0" width="1" height="20" patternUnits="userSpaceOnUse">
                        <rect width="10" height="20" fill="white"/>
                        <rect width="10" height="10" fill="#0000FF"/>
                    </pattern>
                    <pattern id="stripe-brown" x="0" y="0" width="1" height="20" patternUnits="userSpaceOnUse">
                        <rect width="10" height="20" fill="white"/>
                        <rect width="10" height="10" fill="#8B4513"/>
                    </pattern>
                </defs>

                <rect width="800" height="380" fill="white" />
                
                <g id="main-content">
                    <g transform="translate(80, 80)">
                        <rect x="0" y="30" width="140" height="200" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
                        <rect x="15" y="0" width="110" height="30" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
                        <text x="70" y="22" font-family="Arial" font-size="12" text-anchor="middle" letter-spacing="7" font-weight="bold">1 2 3 4 5 6 7 8</text>
                        
                        <rect x="22" y="30" width="10" height="100" fill="url(#stripe-orange)"/> <rect x="36" y="30" width="10" height="100" fill="#FF8C00"/> <rect x="50" y="30" width="10" height="100" fill="url(#stripe-green)"/> <rect x="64" y="30" width="10" height="100" fill="#0000FF"/> <rect x="78" y="30" width="10" height="100" fill="url(#stripe-blue)"/> <rect x="92" y="30" width="10" height="100" fill="#32CD32"/> <rect x="106" y="30" width="10" height="100" fill="url(#stripe-brown)"/> <rect x="120" y="30" width="10" height="100" fill="#8B4513"/> <path d="M 0 170 Q 0 230 140 230 Q 140 170 140 170 Z" fill="#2a8cff" />
                        <text x="70" y="210" fill="white" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">MASTER</text>
                    </g>

                    <g transform="translate(580, 80)">
                        <rect x="0" y="30" width="140" height="200" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
                        <rect x="15" y="0" width="110" height="30" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
                        <text x="70" y="22" font-family="Arial" font-size="12" text-anchor="middle" letter-spacing="7" font-weight="bold">1 2 3 4 5 6 7 8</text>
                        
                        <rect x="22" y="30" width="10" height="100" fill="url(#stripe-orange)"/> 
                        <rect x="36" y="30" width="10" height="100" fill="#FF8C00"/>
                        <rect x="50" y="30" width="10" height="100" fill="url(#stripe-green)"/>
                        <rect x="64" y="30" width="10" height="100" fill="#0000FF"/>
                        <rect x="78" y="30" width="10" height="100" fill="url(#stripe-blue)"/>
                        <rect x="92" y="30" width="10" height="100" fill="#32CD32"/>
                        <rect x="106" y="30" width="10" height="100" fill="url(#stripe-brown)"/>
                        <rect x="120" y="30" width="10" height="100" fill="#8B4513"/>
                        
                        <path d="M 0 170 Q 0 230 140 230 Q 140 170 140 170 Z" fill="#2a8cff" />
                        <text x="70" y="210" fill="white" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">SLAVE</text>
                    </g>
                </g>

                <path d="M 220 300 C 350 300, 350 360, 400 360 C 450 360, 450 300, 580 300" stroke="#2a8cff" stroke-width="16" fill="none" stroke-linecap="round"/>
            </svg>
        </div>

        <button class="copy-btn" onclick="copyAsImage()">📋 Скопировать схему</button>
    </div>
</div>

<div id="toast" class="toast">✅ Схема скопирована!</div>

<script>
    async function copyAsImage() {
        const svg = document.getElementById('bmsSvg');
        const toast = document.getElementById('toast');
        const svgData = new XMLSerializer().serializeToString(svg);
        const img = new Image();
        const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
            const canvas = document.createElement("canvas");
            canvas.width = 800;
            canvas.height = 380;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            canvas.toBlob(async (blob) => {
                try {
                    const data = [new ClipboardItem({ [blob.type]: blob })];
                    await navigator.clipboard.write(data);
                    toast.style.display = 'block';
                    setTimeout(() => toast.style.display = 'none', 2000);
                } catch (err) {
                    alert("Ошибка: для копирования нужен HTTPS");
                }
                URL.revokeObjectURL(url);
            }, 'image/png');
        };
        img.src = url;
    }
</script>

</body>
</html>
